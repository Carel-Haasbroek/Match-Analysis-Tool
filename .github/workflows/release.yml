name: Release

# Tagging a version is what ships it. Nothing here runs on an ordinary push, so
# day-to-day commits cost no minutes and cannot publish anything by accident.
on:
  push:
    tags:
      - 'v*'
  # so a tag made in the web UI, or a run that needs repeating, can be started by hand
  workflow_dispatch:

permissions:
  contents: write        # the default token is read-only; creating a Release needs write

jobs:
  windows:
    # The NSIS installer can only be built on Windows. Public repos get unlimited minutes.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Two ways this goes wrong, both caught here rather than halfway through a build.
      #
      # A run started by hand defaults to a branch, and there is no version to publish
      # under on a branch - pick the tag in the "Run workflow" dropdown instead.
      #
      # And electron-builder names every artifact, and writes latest.yml, from the
      # version in package.json - never from the tag. Left unchecked, tagging v1.0.2
      # without bumping package.json publishes a v1.0.2 release full of 1.0.1 files,
      # which is confusing to find and annoying to undo. `npm version` keeps the two in
      # step; this catches a tag made by hand.
      - name: Must be a version tag that matches package.json
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "This has to run on a tag, not on $GITHUB_REF_NAME."
            echo "Actions -> Release -> Run workflow -> choose the tag in the dropdown."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      - run: npm ci

      # The headless pair. The Electron-driven suites open real windows and are run
      # locally rather than here.
      - run: npm test

      # Not `npm run dist`: that appends the local tidy-up step, which has nothing to
      # do here and would run after publishing anyway.
      - name: Build
        run: npx electron-builder --publish never

      # Uploaded by name, rather than by electron-builder's own publisher.
      #
      # The publisher sends everything the build produced - latest.yml and a .blockmap
      # alongside the two exes - and both of those are read only by electron-updater,
      # which this app does not use. Naming the files is the only way to say exactly
      # what a release contains. (package.json keeps its publish block: electron-builder
      # still reads it for artifact metadata, it just no longer does the uploading.)
      #
      # What cannot be removed is "Source code (zip)" and "Source code (tar.gz)".
      # GitHub generates those from the tag itself, on every release, and offers no way
      # to turn them off.
      #
      # Re-runnable on purpose: a tag pushed from the web UI may already have a release,
      # and a run repeated by hand must not fail the second time.
      - name: Publish the installer and the portable exe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          setup=(dist/*Setup*.exe)
          portable=(dist/*portable*.exe)
          if [ ${#setup[@]} -ne 1 ] || [ ${#portable[@]} -ne 1 ]; then
            echo "expected exactly one installer and one portable exe. dist holds:"
            ls -l dist/ || echo "  no dist folder at all - the build produced nothing"
            exit 1
          fi
          ls -lh "${setup[0]}" "${portable[0]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${setup[0]}" "${portable[0]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${setup[0]}" "${portable[0]}" \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # A green run that published nothing is the failure worth catching, so read back
      # what is actually on the release rather than what was in dist.
      - name: What was published
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) bytes"' || echo "no release to read"
