name: Release

# Tagging a version is what ships it. Nothing here runs on an ordinary push, so
# day-to-day commits cost no minutes and cannot publish anything by accident.
on:
  push:
    tags:
      - 'v*'
  # so a tag made in the web UI, or a run that needs repeating, can be started by hand
  workflow_dispatch:

permissions:
  contents: write        # the default token is read-only; creating a Release needs write

jobs:
  windows:
    # The NSIS installer can only be built on Windows. Public repos get unlimited minutes.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Two ways this goes wrong, both caught here rather than halfway through a build.
      #
      # A run started by hand defaults to a branch, and there is no version to publish
      # under on a branch - pick the tag in the "Run workflow" dropdown instead.
      #
      # And electron-builder names every artifact, and writes latest.yml, from the
      # version in package.json - never from the tag. Left unchecked, tagging v1.0.2
      # without bumping package.json publishes a v1.0.2 release full of 1.0.1 files,
      # which is confusing to find and annoying to undo. `npm version` keeps the two in
      # step; this catches a tag made by hand.
      - name: Must be a version tag that matches package.json
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "This has to run on a tag, not on $GITHUB_REF_NAME."
            echo "Actions -> Release -> Run workflow -> choose the tag in the dropdown."
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "releasing $pkg"

      - run: npm ci

      # The headless pair. The Electron-driven suites open real windows and are run
      # locally rather than here.
      - run: npm test

      # Not `npm run dist`: that appends the local tidy-up step, which has nothing to
      # do here and would run after publishing anyway.
      #
      # electron-builder's GitHub publisher drafts by default, which looks exactly like
      # a silent failure: the run goes green, and the assets sit on a draft release the
      # public never sees. package.json sets releaseType to "release" so they land on
      # the real one.
      - name: Build and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A green run that published nothing is the failure mode worth catching, so say
      # out loud what was built and how big it is.
      - name: What was built
        if: always()
        shell: bash
        run: ls -lh dist/*.exe dist/*.yml 2>/dev/null || echo "no artifacts in dist/"
